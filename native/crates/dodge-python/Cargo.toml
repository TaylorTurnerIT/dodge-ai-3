[package]
name = "dodge-python"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "dodge_native"
crate-type = ["cdylib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
dodge-batch = { path = "../dodge-batch" }
dodge-core = { path = "../dodge-core" }
ndarray = "0.17.1"
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["abi3-py311"] }

[lints]
workspace = true
