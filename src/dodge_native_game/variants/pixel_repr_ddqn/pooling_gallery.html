<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pooling readout comparison</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111923;color:#eaf0f7;font:15px system-ui;height:100dvh;display:flex;flex-direction:column;padding:12px;gap:8px;overflow:hidden}h1{font-size:20px;margin:0}nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}select{background:#273548;color:inherit;padding:6px;border:1px solid #738299}label{display:flex;align-items:center;gap:6px}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;flex:1;min-height:0}.panel{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;position:relative}.panel b{font-size:14px}.panel img{display:block;width:100%;height:auto;max-height:calc(100dvh - 205px);aspect-ratio:1;object-fit:contain;image-rendering:pixelated;background:#0b1119}.panel .error{color:#ff9b9b;text-align:center;margin:0;font-size:12px}.hidden{display:none}#metrics{font-size:12px;line-height:1.35;min-height:34px;margin:0}#load-error{color:#ff9b9b;min-height:18px;margin:0}small{color:#b7c8db} </style>
<h1>Pooling readouts versus retained spatial tokens</h1><small>Frozen LeWM · current-frame reconstruction · pooling changes the readout only.</small>
<nav><label>Pooling<select id="mode"><option value="mean">Mean</option><option value="max">Max</option><option value="attention">Attention</option><option value="grid4">Grid4</option></select></label><label>Updates<select id="step"><option>512</option><option selected>2048</option></select></label><label>Split<select id="split"><option value="validation">Held-out</option><option value="train">Training</option></select></label><label>Scene<select id="scene"></select></label><label>Frame<select id="control"><option value="reconstructed">Matching frame</option><option value="wrong-latent">Wrong frame</option></select></label></nav>
<p id="load-error" class="hidden" role="alert"></p>
<main><div class="panel"><b>Observed</b><img id="observed" alt="Observed native frame"><p id="observed-error" class="error hidden"></p></div><div class="panel"><b id="pooling-label">Selected pooling</b><img id="pooling" alt="Selected pooling reconstruction"><p id="pooling-error" class="error hidden"></p></div><div class="panel"><b>§Z full patch</b><img id="patch" alt="§Z full patch reconstruction"><p id="patch-error" class="error hidden"></p></div><div class="panel"><b>§Z CLS</b><img id="cls" alt="§Z CLS reconstruction"><p id="cls-error" class="error hidden"></p></div></main>
<p id="metrics"></p>
<script>const poolingRun=__POOLING_RUN__,spatialRun=__SPATIAL_RUN__,modes=["mean","max","attention","grid4"],modeLabels={mean:"Mean",max:"Max",attention:"Attention",grid4:"Grid4"},steps=[512,2048],sceneNames=["Player stationary","Player cardinal","Player diagonal","Player zigzag","Player stop-go","Enemies static","Enemies static dense","Enemies horizontal","Enemies vertical","Enemies diagonal","Enemies speed","Enemies size","Enemies many","Mixed static/moving","Mixed many","Permanent pattern"],$=id=>document.getElementById(id);sceneNames.forEach((name,i)=>$("scene").add(new Option(name,i)));let generation=0;function path(run,step,split,index,suffix){return `${run}/images/step-${step}/${split}-${String(index).padStart(2,"0")}-${suffix}.png`}function panelError(id,message){const image=$(id),error=$(id+"-error");image.removeAttribute("src");error.textContent=message;error.classList.remove("hidden");$("load-error").textContent="Image load error: "+message;$("load-error").classList.remove("hidden")}function setImage(id,url,label){const image=$(id),error=$(id+"-error");error.classList.add("hidden");image.alt=label;image.onerror=()=>panelError(id,`missing ${url}`);image.src=url}function number(value){return typeof value==="number"&&Number.isFinite(value)?value.toFixed(6):"n/a"}function recall(value){const item=value&&value[2];return typeof item==="number"&&Number.isFinite(item)?(100*item).toFixed(2)+"%":"n/a"}async function update(){const generationId=++generation,mode=$("mode").value,step=$("step").value,split=$("split").value,index=$("scene").value,control=$("control").value,suffix=control==="wrong-latent"?"wrong-latent":"reconstructed",prefix=split+"-"+String(index).padStart(2,"0");$("pooling-label").textContent=modeLabels[mode]+" pooling";$("load-error").classList.add("hidden");$("metrics").textContent="Loading evaluation…";setImage("observed",path(`${spatialRun}-cls`,step,split,index,"observed"),"Observed native frame");setImage("pooling",path(`${poolingRun}-${mode}`,step,split,index,suffix),`${modeLabels[mode]} pooling reconstruction`);setImage("patch",path(`${spatialRun}-patch`,step,split,index,suffix),"§Z full patch reconstruction");setImage("cls",path(`${spatialRun}-cls`,step,split,index,suffix),"§Z CLS reconstruction");try{const files=[`${poolingRun}-${mode}`,`${spatialRun}-patch`,`${spatialRun}-cls`],reports=await Promise.all(files.map(run=>fetch(`${run}/evaluation-${step}.json`).then(response=>{if(!response.ok)throw Error(`${run}/evaluation-${step}.json (${response.status})`);return response.json()})));if(generationId!==generation)return;const values=reports.map((report,i)=>{const splitData=(control==="wrong-latent"?report.wrong_latent_control:report.splits)[split];return `${[modeLabels[mode]+" pool","§Z patch","§Z CLS"][i]}: changed MSE ${number(splitData.changed_region_mse)}, changing cream recall ${recall(splitData.palette_changed_per_color_recall)}`});$("metrics").textContent=`${split} · scene ${prefix} · ${values.join(" · ")}`}catch(error){if(generationId===generation){$("metrics").textContent="Evaluation load error: "+error.message;$("load-error").textContent="Evaluation load error: "+error.message;$("load-error").classList.remove("hidden")}}}[
"mode","step","split","scene","control"].forEach(id=>$(id).onchange=update);update();</script></html>
