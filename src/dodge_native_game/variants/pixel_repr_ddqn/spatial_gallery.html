<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spatial readout comparison</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111923;color:#eaf0f7;font:15px system-ui;height:100dvh;display:flex;flex-direction:column;padding:16px;gap:12px}h1{font-size:20px;margin:0}nav{display:flex;gap:10px;flex-wrap:wrap}select{background:#273548;color:inherit;padding:7px;border:1px solid #738299}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;flex:1;min-height:0}.panel{min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}img{width:100%;max-height:calc(100dvh - 235px);object-fit:contain;image-rendering:pixelated;aspect-ratio:1}p{margin:0}small{color:#b7c8db}#metrics{font-size:13px;min-height:38px}label{display:flex;align-items:center;gap:6px}</style>
<h1>Local features versus global CLS</h1><p>Frozen LeWM · current-frame reconstruction · direct pixels are a decoder control.</p>
<nav><label>Updates<select id="step"><option>512</option><option>2048</option><option selected>8192</option></select></label><label>Split<select id="split"><option value="validation">Held-out</option><option value="train">Training</option></select></label><label>Scene<select id="scene"></select></label><label>Input<select id="kind"><option value="reconstructed">Matching frame</option><option value="wrong-latent">Wrong frame control</option></select></label></nav>
<main><div class="panel"><b>Observed</b><img id="observed" alt="Observed native frame"></div><div class="panel"><b>Global CLS</b><img id="cls" alt="CLS reconstruction"></div><div class="panel"><b>Local patch tokens</b><img id="patch" alt="Patch reconstruction"></div><div class="panel"><b>Direct pixels (control)</b><img id="pixels" alt="Direct pixel control reconstruction"></div></main><p id="metrics"></p><small>No entity labels. These images test retained visual detail, not prediction or control.</small>
<script>const run="__RUN__",arms=["cls","patch","pixels"],names=["Player stationary","Player cardinal","Player diagonal","Player zigzag","Player stop-go","Enemies static","Enemies static dense","Enemies horizontal","Enemies vertical","Enemies diagonal","Enemies speed","Enemies size","Enemies many","Mixed static/moving","Mixed many","Permanent pattern"];const $=id=>document.getElementById(id);names.forEach((name,i)=>$("scene").add(new Option(name,i)));let generation=0;async function update(){const g=++generation,step=$("step").value,split=$("split").value,n=String($("scene").value).padStart(2,"0"),kind=$("kind").value,prefix=`images/step-${step}/${split}-${n}`;$("observed").src=`${run}-cls/${prefix}-observed.png`;arms.forEach(a=>$(a).src=`${run}-${a}/${prefix}-${kind}.png`);try{const reports=await Promise.all(arms.map(a=>fetch(`${run}-${a}/evaluation-${step}.json`).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})));if(g!==generation)return;$("metrics").textContent=reports.map((r,i)=>{let m=(kind==="wrong-latent"?r.wrong_latent_control:r.splits)[split];return `${arms[i]}: MSE ${m.mse.toFixed(6)}, changed cream recall ${(100*m.palette_changed_per_color_recall[2]).toFixed(2)}%`}).join(" · ")}catch(e){if(g===generation)$("metrics").textContent="Evaluation unavailable: "+e.message}}["step","split","scene","kind"].forEach(id=>$(id).onchange=update);update();</script></html>
